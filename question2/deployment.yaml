apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-app
  labels:
    app: event-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event-app
  template:
    metadata:
      labels:
        app: event-app
    spec:
      containers:
      - name: event-app
        image: vineshhhhh2001/event-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: event-app-service
spec:
  type: NodePort
  selector:
    app: event-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30011
