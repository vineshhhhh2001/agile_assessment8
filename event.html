<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Event Registration</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap");
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #0a0e27, #1a1a4e, #0d1b45);
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 40px 20px; color: #e2e8f0;
    }
    .wrapper { max-width: 680px; width: 100%; }
    .header {
      text-align: center; margin-bottom: 32px;
      animation: slideDown 0.6s ease;
    }
    @keyframes slideDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    .event-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff; font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px;
      padding: 4px 14px; border-radius: 20px; margin-bottom: 14px;
    }
    .event-name { font-size: 2rem; font-weight: 900; margin-bottom: 6px;
      background: linear-gradient(90deg, #fbbf24, #f87171); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .event-desc { font-size: 0.95rem; color: #94a3b8; line-height: 1.6; }
    .card {
      background: rgba(255,255,255,0.06); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 24px;
      padding: 40px 44px; box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: fadeUp 0.7s ease 0.1s both;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.8px; color: #f59e0b; }
    input, select {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 12px 16px; color: #f1f5f9; font-family: inherit;
      font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: #475569; }
    input:focus, select:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
    select option { background: #1e293b; }
    .btn {
      grid-column: 1 / -1; margin-top: 8px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff; border: none; border-radius: 12px; padding: 16px;
      font-size: 1rem; font-weight: 700; cursor: pointer; letter-spacing: 0.5px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(245,158,11,0.35); }
    .btn:active { transform: translateY(0); }
    .success-msg {
      display: none; text-align: center; padding: 18px;
      background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3);
      border-radius: 12px; color: #4ade80; font-weight: 600; margin-top: 16px;
    }
    .footer-note { text-align:center; margin-top:24px; font-size:0.78rem; color:#4a5568; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="event-badge">VIT Event 2025</div>
      <h1 class="event-name">TechFest – National Hackathon</h1>
      <p class="event-desc">24-hour coding competition for all engineering students.<br>Register before seats run out!</p>
    </div>
    <div class="card">
      <form id="regForm" onsubmit="handleSubmit(event)">
        <div class="form-grid">
          <div class="form-group full">
            <label for="eventName">Event Name</label>
            <input id="eventName" type="text" value="TechFest – National Hackathon 2025" readonly/>
          </div>
          <div class="form-group full">
            <label for="eventDesc">Event Description</label>
            <input id="eventDesc" type="text" value="24-hour national-level coding hackathon at VIT Vellore" readonly/>
          </div>
          <div class="form-group">
            <label for="studentName">Student Name</label>
            <input id="studentName" type="text" placeholder="Vinesh Krishna" required/>
          </div>
          <div class="form-group">
            <label for="regNo">Register Number</label>
            <input id="regNo" type="text" placeholder="24MIS0054" required/>
          </div>
          <div class="form-group">
            <label for="dept">Department</label>
            <select id="dept" required>
              <option value="">Select Department</option>
              <option value="MIS">MIS</option>
              <option value="CSE">CSE</option>
              <option value="ECE">ECE</option>
              <option value="EEE">EEE</option>
              <option value="MECH">Mechanical</option>
              <option value="CIVIL">Civil</option>
            </select>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="vinesh@vit.ac.in" required/>
          </div>
          <div class="form-group full">
            <label for="eventDate">Event Date</label>
            <input id="eventDate" type="date" value="2025-11-15" required/>
          </div>
          <button class="btn" type="submit" id="registerBtn">Register Now</button>
        </div>
      </form>
      <div class="success-msg" id="successMsg">
        Registration Successful! You will receive a confirmation email shortly.
      </div>
    </div>
    <p class="footer-note">Deployed via Docker + Kubernetes (3 Replicas) | Jenkins CI/CD</p>
  </div>
  <script>
    function handleSubmit(e) {
      e.preventDefault();
      document.getElementById("registerBtn").textContent = "Registered!";
      document.getElementById("registerBtn").style.background = "linear-gradient(135deg,#22c55e,#16a34a)";
      document.getElementById("successMsg").style.display = "block";
    }
  </script>
</body>
</html>
