# ============================================================
# Q1 & Q2 – Kubernetes Deployment + NodePort Service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-app
  labels:
    app: profile-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-app
  template:
    metadata:
      labels:
        app: profile-app
    spec:
      containers:
      - name: profile-app
        image: vineshhhhh2001/profile-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: profile-app-service
spec:
  type: NodePort
  selector:
    app: profile-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30010
---
# ============================================================
# Q2 – Event Registration App (3 replicas)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-app
  labels:
    app: event-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event-app
  template:
    metadata:
      labels:
        app: event-app
    spec:
      containers:
      - name: event-app
        image: vineshhhhh2001/event-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: event-app-service
spec:
  type: NodePort
  selector:
    app: event-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30011
---
